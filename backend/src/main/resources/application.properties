# ─── Server ─────────────────────────────────────────────────────────
server.port=${PORT:8089}
spring.application.name=campusnest-backend

# ─── Neon Cloud PostgreSQL ──────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-falling-queen-aptkpzkt-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_Pev0aVl5pIoB}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── HikariCP Pool (optimized for Neon serverless) ──────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# ─── JPA / Hibernate ────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Logging ────────────────────────────────────────────────────────
logging.level.org.hibernate.SQL=INFO
logging.level.com.campusnest=INFO
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr(%-30logger{30}){cyan} %msg%n

# ─── CORS (allow React dev server & Production) ─────────────────────
campusnest.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# ─── Jackson JSON ───────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ─── Allow larger payloads (for base64 proof uploads, ~5MB images) ──
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB
